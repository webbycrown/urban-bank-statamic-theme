{{ form:career action="/!/forms/career" class="js-theme-form" files="true" }}
	<div class="stay-connect-alert stay-connect-alert--error" hidden></div>
	<div class="stay-connect-success" hidden>
		<p>Thanks — we received your application and will reply if there is a match.</p>
	</div>
	<div class="stay-connect-fields user__details">
		<div class="input__box_group">
			<div class="input__box">
				<label class="details" for="career-first-name">First name</label>
				<input id="career-first-name" type="text" name="first_name" placeholder="First name" value="{{ old:first_name }}" required>
			</div>
			<div class="input__box">
				<label class="details" for="career-last-name">Last name</label>
				<input id="career-last-name" type="text" name="last_name" placeholder="Last name" value="{{ old:last_name }}" required>
			</div>
		</div>
		<div class="input__box_group">
			<div class="input__box">
				<label class="details" for="career-email">Email</label>
				<input id="career-email" type="email" name="email" placeholder="you@example.com" value="{{ old:email }}" required>
			</div>
			<div class="input__box">
				<label class="details" for="career-phone">Phone</label>
				<div class="wb_mobile_number">
					<input id="career-phone" type="tel" name="phone" placeholder="Phone number" value="{{ old:phone }}" required>
				</div>
			</div>
		</div>
		<div class="input__box_group input__box_group_status">
			<div class="input__box">
				<label class="details" for="career-work-status">Work status</label>
				<input id="career-work-status" type="text" name="work_status" placeholder="Experienced or fresher" value="{{ old:work_status }}" required>
			</div>
			<div class="input__box">
				<label class="details" for="career-role">Role</label>
				<input id="career-role" type="text" name="role" placeholder="Role you are applying for" value="{{ old:role }}">
			</div>
		</div>
		<div class="input__box_group input__box_group_resume">
			<div class="input__box">
				<label class="details" for="career-resume">Upload Resume (PDF, DOC, or DOCX, max 5 MB)</label>
				<div class="input_file_wrap">
					<p>Choose File</p>
					<input id="career-resume" type="file" name="resume" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required>
				</div>
			</div>
		</div>
		<input type="text" class="js-honeypot" name="honeypot" tabindex="-1" autocomplete="off">
		<button type="submit" class="bw_custom_buttom bw_flex_btn">
			<span class="btn-label">Apply Now <span class="material-symbols-sharp">chevron_right</span></span>
			<span class="btn-loading" hidden>Sending…</span>
		</button>
	</div>
{{ /form:career }}
