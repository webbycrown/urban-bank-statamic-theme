<head>
	<title>{{ if seo_title }}{{ seo_title }}{{ elseif title }}{{ title }}{{ if title != setting:site_name }} — {{ setting:site_name ?? site:name }}{{ /if }}{{ else }}{{ setting:error_title ?? 'Page not found' }} — {{ setting:site_name ?? site:name }}{{ /if }}</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="csrf-token" content="{{ csrf_token }}">
	<meta name="title" content="{{ seo_title ?? title ?? setting:site_name ?? site:name }}">
	<meta name="description" content="{{ seo_description ?? excerpt ?? setting:seo_description }}">
	{{ if seo_keywords or setting:seo_keywords }}<meta name="keywords" content="{{ seo_keywords ?? setting:seo_keywords }}">{{ /if }}
	<meta name="robots" content="{{ seo_robots ?? 'index, follow' }}">
	<link rel="canonical" href="{{ seo_canonical ?? permalink ?? current_url }}">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="{{ setting:site_name ?? site:name }}">
	<meta property="og:title" content="{{ seo_title ?? title ?? setting:site_name ?? site:name }}">
	<meta property="og:description" content="{{ seo_description ?? excerpt ?? setting:seo_description }}">
	<meta property="og:url" content="{{ permalink ?? current_url }}">
	<meta property="og:image" content="{{ config:app:url }}{{ partial:partials/media-url :file="seo_image ?? setting:seo_image ?? setting:logo" fallback="image/logo.png" }}">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="{{ seo_title ?? title ?? setting:site_name ?? site:name }}">
	<meta name="twitter:description" content="{{ seo_description ?? excerpt ?? setting:seo_description }}">
	<meta name="twitter:image" content="{{ config:app:url }}{{ partial:partials/media-url :file="seo_image ?? setting:seo_image ?? setting:logo" fallback="image/logo.png" }}">
	<link rel="icon" href="{{ partial:partials/media-url :file="setting:favicon" fallback="image/five-icon.png" }}" type="image/gif">
	<style id="bw-page-loader-css">
		html { background: #222828; }
		html.bw-is-loading, html.bw-is-loading body { overflow: hidden; }
		.bw_page_loader {
			position: fixed;
			inset: 0;
			z-index: 999999;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #222828;
			transition: opacity .35s ease, visibility .35s ease;
		}
		.bw_page_loader.is-done {
			opacity: 0;
			visibility: hidden;
			pointer-events: none;
		}
		.bw_page_loader_inner {
			position: relative;
			width: 120px;
			height: 120px;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.bw_page_loader_inner img {
			width: 78px;
			height: auto;
			max-width: 78px;
			position: relative;
			z-index: 1;
		}
		.bw_page_loader_ring {
			position: absolute;
			inset: 0;
			border-radius: 50%;
			border: 2px solid rgba(100, 220, 182, .18);
			border-top-color: #64DCB6;
			border-right-color: #F7FBA4;
			animation: bw-loader-spin .8s linear infinite;
		}
		@keyframes bw-loader-spin {
			to { transform: rotate(360deg); }
		}
		.material-symbols-sharp,
		.material-symbols-outlined,
		.material-symbols-rounded,
		.material-icons {
			font-display: block;
		}
	</style>
	<noscript><style>html, body { overflow: visible !important; } .bw_page_loader { display: none !important; }</style></noscript>
	<link rel="preload" href="{{ partial:partials/media-url :file="setting:logo" fallback="image/logo.png" }}" as="image">
	<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
	<link rel="stylesheet" href="/assets/css/aos.css">
	<link rel="stylesheet" href="/assets/css/all.min.css">
	<link rel="stylesheet" href="/assets/css/magnific-popup.css">
	<link rel="stylesheet" href="/assets/css/swiper-bundle.min.css">
	<link rel="stylesheet" type="text/css" href="/assets/css/header.css">
	<link rel="stylesheet" type="text/css" href="/assets/css/footer.css">
	<link rel="stylesheet" type="text/css" href="/assets/css/error.css">
	<link rel="stylesheet" type="text/css" href="/assets/css/style.css?v=30">
	<link rel="stylesheet" type="text/css" href="/assets/css/theme-responsive.css?v=30">
	<style>
		.is-hidden { display: none !important; }
		.js-theme-form.is-loading [type="submit"] { opacity: .7; pointer-events: none; }
		.stay-connect-alert { display: none; margin: 12px 0; color: #F7FBA4; font-size: 15px; line-height: 1.4; }
		.stay-connect-alert.is-visible { display: block; }
		.stay-connect-success { display: none; margin: 0; }
		.stay-connect-success.is-visible { display: block; }
		.bw_form_thanks {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 12px;
			max-width: 100%;
			padding: 14px 28px;
			border-radius: 40px;
			border: 1px solid #09121F;
			background: rgba(9, 18, 31, 0.1);
			color: #09121F;
			font-family: var(--font_family_2), Urbanist, sans-serif;
			font-size: 18px;
			font-weight: 600;
			line-height: 28px;
			text-align: left;
		}
		.bw_form_thanks p { margin: 0; color: inherit; font: inherit; }
		.bw_form_thanks_icon { display: flex; flex-shrink: 0; }
		.bw_form_thanks_icon svg { display: block; }
		.bw_footer .bw_form_thanks,
		.bw_contact_page_section .bw_form_thanks,
		.bw_grid-detail-2_hero_section .bw_form_thanks {
			width: 100%;
			justify-content: flex-start;
			border-color: #64DCB6;
			background: rgba(100, 220, 182, 0.12);
			color: #F7FBA4;
			font-size: 16px;
			line-height: 24px;
		}
		.js-honeypot { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
		button.bw_custom_buttom { border: 0; cursor: pointer; }
		.bw_main_body, .bw_main_body .page, .bw_main_body main { pointer-events: auto; }
	</style>
	<script src="/assets/js/jquery.min.js"></script>
	<script src="/assets/js/aos.js"></script>
	<script src="/assets/js/jquery.magnific-popup.min.js"></script>
	<script src="/assets/js/swiper-bundle.min.js"></script>
	{{ if body_class != "index-2" && body_class != "index-3" }}
	<script src="/assets/js/waypoints.min.js"></script>
	<script src="/assets/js/all.min.js"></script>
	<script src="/assets/js/jquery.counterup.min.js"></script>
	<script src="/assets/js/chart.min.js"></script>
	<script src="/assets/js/imask.min.js"></script>
	{{ /if }}
</head>
