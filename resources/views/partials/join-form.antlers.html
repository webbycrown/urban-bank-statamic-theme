{{ form:newsletter action="/!/forms/newsletter" class="js-theme-form" }}
	<div class="stay-connect-alert stay-connect-alert--error" hidden></div>
	<div class="stay-connect-success" hidden>
		<div class="bw_form_thanks">
			<span class="bw_form_thanks_icon" aria-hidden="true">
				<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
					<circle cx="12" cy="12" r="11" stroke="currentColor" stroke-width="1.6"></circle>
					<path d="M7.2 12.3l3.1 3.1 6.5-6.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
				</svg>
			</span>
			<p>{{ setting:newsletter_success ?? 'Thanks — you are on the list.' }}</p>
		</div>
	</div>
	<div class="stay-connect-fields">
		<label class="bw_sr_only" for="join-email">Email</label>
		<input id="join-email" class="bw_custom_input" type="email" name="email" placeholder="{{ placeholder ?? setting:newsletter_placeholder ?? 'Enter your email' }}" value="{{ old:email }}" required autocomplete="email">
		<input type="text" class="js-honeypot" name="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
		<button type="submit" class="bw_custom_buttom bw_flex_btn">
			<span class="btn-label">{{ button ?? setting:newsletter_button ?? 'Send' }}
				<svg width="30" height="29" viewBox="0 0 30 29" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M28.6269 13.6397L13.08 14.1826" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
					<path d="M28.6271 13.64L9.86763 23.4931L13.0802 14.1829L9.22601 5.11948L28.6271 13.64Z" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
				</svg>
			</span>
			<span class="btn-loading" hidden>{{ setting:form_sending_label ?? 'Sending…' }}</span>
		</button>
	</div>
{{ /form:newsletter }}
