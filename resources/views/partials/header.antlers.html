<!-- start_bw_header -->
	<header class="bw_header">
		<div class="bw_container">
			<div class="bw_header_contant">
				<div class="bw_header_logo_content">
					<a href="/"><img src="{{ partial:partials/media-url :file="setting:logo" fallback="image/logo.png" }}" alt="{{ setting:site_name ?? 'Urban Bank' }}"></a>
				</div>
				{{ partial:partials/nav-header }}
				<div class="bw_mobile_menu_icon">
					<button type="button" class="bw_mobile_menu_open" aria-label="Open menu" aria-controls="bw-menubar" aria-expanded="false"><span class="material-symbols-outlined" aria-hidden="true">menu</span></button>
				</div>
				{{ if setting:cta_url }}
				<a class="bw_custom_buttom" href="{{ setting:cta_url }}">{{ setting:cta_label ?? 'Talk to us' }}</a>
				{{ /if }}
			</div>
		</div>
	</header>
	<!-- close_bw_header -->
