title: Team
tabs:
  main:
    display: Main
    sections:
      -
        fields:
        -
          handle: title
          field:
            type: text
            display: Title
        -
          handle: image
          field:
            type: assets
            display: Image
            container: assets
            max_files: 1
        -
          handle: excerpt
          field:
            type: textarea
            display: Excerpt
            instructions: Short intro under the name.
        -
          handle: content
          field:
            type: markdown
            display: Bio
            instructions: Full bio shown on the team detail page.
            automatic_line_breaks: true
        -
          handle: role
          field:
            type: text
            display: Role
        -
          handle: email
          field:
            type: text
            display: Email
        -
          handle: phone
          field:
            type: text
            display: Phone
        -
          handle: order
          field:
            type: text
            display: Order
  seo:
    display: SEO
    sections:
      -
        display: Search and social
        fields:
        -
          import: seo
