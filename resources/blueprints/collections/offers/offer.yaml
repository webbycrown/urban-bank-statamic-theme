title: Offers
tabs:
  main:
    display: Main
    sections:
      -
        fields:
        -
          handle: title
          field:
            type: text
            display: Title
        -
          handle: image
          field:
            type: assets
            display: Image
            container: assets
            max_files: 1
        -
          handle: excerpt
          field:
            type: textarea
            display: Excerpt
        -
          handle: content_sections
          field:
            type: replicator
            display: Offer sections
            instructions: Add one group per heading (How it works, Terms). Click Add section for another group.
            button_label: Add section
            collapse: false
            sets:
              content:
                display: Content
                sets:
                  text_section:
                    display: Text section
                    fields:
                      -
                        handle: heading
                        field:
                          type: text
                          display: Heading
                      -
                        handle: body
                        field:
                          type: markdown
                          display: Text
                          automatic_line_breaks: true
        -
          handle: order
          field:
            type: text
            display: Order
  seo:
    display: SEO
    sections:
      -
        display: Search and social
        fields:
        -
          import: seo
