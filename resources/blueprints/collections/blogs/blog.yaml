title: Blogs
tabs:
  main:
    display: Main
    sections:
      -
        fields:
        -
          handle: title
          field:
            type: text
            display: Title
        -
          handle: image
          field:
            type: assets
            display: Image
            container: assets
            max_files: 1
        -
          handle: excerpt
          field:
            type: textarea
            display: Excerpt
        -
          handle: content
          field:
            type: markdown
            display: Content
            instructions: Full article body. Use headings for sections.
            container: assets
            restrict: false
            automatic_line_breaks: true
  seo:
    display: SEO
    sections:
      -
        display: Search and social
        fields:
        -
          import: seo
