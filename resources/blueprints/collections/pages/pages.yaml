title: Pages
tabs:
  main:
    display: Page
    sections:
      -
        display: Content
        fields:
        -
          handle: title
          field:
            type: text
            display: Title
            validate:
              - required
        -
          handle: excerpt
          field:
            type: textarea
            display: Excerpt
            instructions: Short intro. Optional.
      -
        display: Theme sections
        instructions: Every page uses the same Page template. Add any section here and drag to reorder.
        fields:
        -
          import: page_builder
      -
        display: Page chrome
        fields:
        -
          handle: template
          field:
            type: hidden
            default: page
        -
          handle: body_class
          field:
            type: select
            display: Body class
            instructions: Optional CSS hook. Chart.js and counters always load.
            options:
              '': Default
              index-2: Home Two
              index-3: Home Three
            clearable: true
        -
          handle: header_style
          field:
            type: select
            display: Header style
            instructions: Choose the top bar layout for this page.
            options:
              '': Default header
              two: Home Two header
            clearable: true
        -
          handle: hide_footer
          field:
            type: toggle
            display: Hide footer
            instructions: Turn on to hide the site footer on this page.
            default: false
        -
          handle: image
          field:
            type: assets
            display: Fallback image
            container: assets
            max_files: 1
  seo:
    display: SEO
    sections:
      -
        display: Search and social
        fields:
        -
          import: seo
