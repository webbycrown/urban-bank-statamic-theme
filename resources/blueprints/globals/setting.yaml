title: Setting
tabs:
  main:
    display: Main
    sections:
      -
        display: Brand
        fields:
        -
          handle: site_name
          field:
            type: text
            display: Site Name
        -
          handle: logo
          field:
            type: assets
            display: Logo
            container: assets
            max_files: 1
        -
          handle: footer_logo
          field:
            type: assets
            display: Footer logo
            container: assets
            max_files: 1
        -
          handle: favicon
          field:
            type: assets
            display: Favicon
            container: assets
            max_files: 1
        -
          handle: copyright
          field:
            type: text
            display: Copyright
      -
        display: Contact
        fields:
        -
          handle: phone
          field:
            type: text
            display: Phone
        -
          handle: email
          field:
            type: text
            display: Email
        -
          handle: branch_address
          field:
            type: textarea
            display: Branch address
        -
          handle: branch_hours
          field:
            type: textarea
            display: Branch hours
        -
          handle: map_embed
          field:
            type: textarea
            display: Contact map embed URL
        -
          handle: branch_office_label
          field:
            type: text
            display: Head office label
        -
          handle: branch_hours_label
          field:
            type: text
            display: Branch hours label
        -
          handle: branch_contact_label
          field:
            type: text
            display: Talk to us label
        -
          handle: contact_page
          field:
            type: entries
            display: Contact page
            instructions: Used by branch cards and as the default Talk to us target. Survives slug renames.
            max_items: 1
            collections:
              - pages
        -
          handle: careers_page
          field:
            type: entries
            display: Careers page
            instructions: Team section “Open roles” button. Survives slug renames.
            max_items: 1
            collections:
              - pages
        -
          handle: team_page
          field:
            type: entries
            display: Team page
            instructions: “Back to team” on team detail. Survives slug renames.
            max_items: 1
            collections:
              - pages
      -
        display: Forms
        instructions: Success messages and button labels for newsletter, contact, comment, and career forms.
        fields:
        -
          handle: form_sending_label
          field:
            type: text
            display: Sending label
            instructions: Shown on buttons while a form submits.
        -
          handle: newsletter_success
          field:
            type: text
            display: Newsletter success message
        -
          handle: newsletter_placeholder
          field:
            type: text
            display: Newsletter email placeholder
        -
          handle: newsletter_button
          field:
            type: text
            display: Newsletter button
        -
          handle: contact_success
          field:
            type: text
            display: Contact success message
        -
          handle: contact_button
          field:
            type: text
            display: Contact button
        -
          handle: comment_success
          field:
            type: text
            display: Comment success message
        -
          handle: comment_button
          field:
            type: text
            display: Comment button
        -
          handle: career_success
          field:
            type: text
            display: Career success message
        -
          handle: career_button
          field:
            type: text
            display: Career button
        -
          handle: careers_other_roles_heading
          field:
            type: text
            display: Career detail — other roles heading
            instructions: Heading above related open roles on a career detail page.
        -
          handle: careers_join_heading
          field:
            type: text
            display: Career detail — newsletter heading
            instructions: Heading above the newsletter form on a career detail page.
        -
          handle: learn_more_label
          field:
            type: text
            display: Learn more label
            instructions: Default link label on blog and product cards.
      -
        display: Header CTA and social
        fields:
        -
          handle: cta_label
          field:
            type: text
            display: Header CTA label
        -
          handle: cta_url
          field:
            type: link
            display: Header CTA link
            instructions: Prefer a Pages entry so the URL follows renames.
            collections:
              - pages
        -
          handle: facebook
          field:
            type: text
            display: Facebook URL
        -
          handle: twitter
          field:
            type: text
            display: Twitter URL
        -
          handle: linkedin
          field:
            type: text
            display: LinkedIn URL
        -
          handle: instagram
          field:
            type: text
            display: Instagram URL
        -
          handle: youtube
          field:
            type: text
            display: YouTube URL
      -
        display: Mega menu column titles
        fields:
        -
          handle: mega_home_title
          field:
            type: text
            display: Home column
        -
          handle: mega_company_title
          field:
            type: text
            display: Company column
        -
          handle: mega_features_title
          field:
            type: text
            display: Features column
        -
          handle: mega_more_title
          field:
            type: text
            display: More column
      -
        display: App downloads
        fields:
        -
          handle: app_store_url
          field:
            type: text
            display: App Store download URL
        -
          handle: app_store_kicker
          field:
            type: text
            display: App Store kicker
        -
          handle: app_store_name
          field:
            type: text
            display: App Store name
        -
          handle: play_store_url
          field:
            type: text
            display: Google Play download URL
        -
          handle: play_store_kicker
          field:
            type: text
            display: Google Play kicker
        -
          handle: play_store_name
          field:
            type: text
            display: Google Play name
      -
        display: 404 and default SEO
        fields:
        -
          handle: error_title
          field:
            type: text
            display: 404 title
        -
          handle: error_text
          field:
            type: textarea
            display: 404 text
        -
          handle: seo_description
          field:
            type: textarea
            display: Default meta description
            instructions: Used when a page has no SEO description of its own.
        -
          handle: seo_keywords
          field:
            type: text
            display: Default meta keywords
        -
          handle: seo_image
          field:
            type: assets
            display: Default social share image
            container: assets
            max_files: 1
