tabs:
  main:
    display: Main
    sections:
      -
        fields:
        -
          handle: post
          field:
            type: text
            display: Post
        -
          handle: name
          field:
            type: text
            display: Name
            validate:
              - required
        -
          handle: email
          field:
            type: text
            display: Email
            validate:
              - required
              - email
        -
          handle: phone
          field:
            type: text
            display: Phone
        -
          handle: subject
          field:
            type: text
            display: Subject
        -
          handle: message
          field:
            type: textarea
            display: Message
            validate:
              - required
        -
          handle: approved
          field:
            type: toggle
            display: Approved
            instructions: Turn on to show this comment on the blog post. New submissions stay hidden until reviewed.
            default: false
